<!-- Private D-Bus session for isolated DeskNotes test runs.
     Started by scripts/isolated-app-session.py.

     Deliberately has NO <servicedir> and NO <standard_session_servicedirs/>:
     this bus cannot auto-start anything. A normal session bus would exec
     xdg-desktop-portal (-> xdg-desktop-portal-hyprland, which segfaults on
     exit, upstream issue #330), xdg-document-portal (which hijacks the real
     session's /run/user/UID/doc mount) and the at-spi accessibility broker.
     The app only needs the bus for tauri-plugin-single-instance name ownership. -->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <type>session</type>
  <keep_umask/>
  <listen>unix:tmpdir=/tmp</listen>
  <auth>EXTERNAL</auth>
  <policy context="default">
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <allow own="*"/>
  </policy>
</busconfig>
