[package]
name = "desknotes-helper"
version = "1.0.0"
edition = "2021"
description = "Database helper for the DeskNotes Omarchy shell plugin (JSON lines over stdio)"
license = "MIT"

[[bin]]
name = "desknotes-helper"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
